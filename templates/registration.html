{% extends 'dummy1.html' %}

{% block title %}
<title>Registration</title>
{% endblock %}

{% block body_block %}
<div class="container">
    <div class="bubbles">
        {% for i in values %}
        <span style="--i:{{ i }};"></span>
    {% endfor %}
    
    </div>

    <div class="form-wrapper">
        <form method="POST" enctype="multipart/form-data">
            <marquee behavior="alternate">Registration Form</marquee>  
            {% csrf_token %}
            {{ umf.as_p }}
            {{ pmf.as_p }}
            <input type="submit" value="Register" class="btn btn-success">
        </form>
    </div>
</div>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background: #0c192c;
        color: #fff;
        font-size: 25px;
    }

    .container {
        position: relative;
        width: 100%;
        height: 100vh;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        padding: 20px;
    }

    .form-wrapper {
        z-index: 2;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
    }

    form {
        background: transparent;
        border: 2px solid black;
        border-radius: 20px;
        padding: 20px;
        max-width: 600px;
        width: 100%;
        border-left: 10px ridge #ff2d75;
        border-top: 10px ridge #4fc3d4;
        border-bottom: 10px ridge #ff2d75;
        border-right: 10px ridge #4fc3d4;
        backdrop-filter: blur(8px);
    }

    input[type="text"],
    input[type="password"],
    input[type="email"],
    input[type="submit"] {
        width: 100%;
        background: transparent;
        color: #fff;
        border: none;
        border-bottom: 3px solid #4fc3dc;
        margin-bottom: 15px;
        padding: 5px 10px;
    }

    marquee {
        background: linear-gradient(90deg, #4fc3d4, #ff2d75);
        border-radius: 20px;
        padding: 10px;
        margin-bottom: 20px;
        font-weight: bold;
    }

    .bubbles {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-wrap: wrap;
        z-index: 1;
        pointer-events: none;
    }

    .bubbles span {
        position: relative;
        width: 30px;
        height: 30px;
        background: #4fc3d4;
        margin: 0 4px;
        border-radius: 50%;
        box-shadow: 0 0 0 10px #4fc3dc44, 0 0 50px #4fc3dc, 0 0 100px #4fc3dc;
        animation: animate 5s linear infinite;
        animation-duration: calc(128s / var(--i));
    }

    .bubbles span:nth-child(even) {
        background: #ff2d75;
        box-shadow: 0 0 0 10px #ff2d7544, 0 0 50px #ff2d75, 0 0 100px #ff2d75;
    }

    @keyframes animate {
        0% {
            transform: translateY(100vh) scale(0);
        }
        100% {
            transform: translateY(-10vh) scale(0.9);
        }
    }

    @media (max-width: 768px) {
        form {
            font-size: 18px;
            padding: 15px;
        }

        input {
            font-size: 16px;
        }

        marquee {
            font-size: 20px;
        }
    }

    @media (max-width: 480px) {
        form {
            font-size: 16px;
        }

        marquee {
            font-size: 18px;
        }
    }
</style>
{% endblock %}
